<aside id="projectsDrawer" aria-label="Projects" inert>
  <div class="view-head">
    <h2 style="margin:0;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Projects <span class="sec-hint" id="projectsCount"></span></h2>
    <span class="spacer"></span>
    <button id="btnPjAdd" class="primary">+ New project</button>
    <button id="btnPjRefresh" title="Reload">Refresh</button>
  </div>
  <p class="hint" style="margin:.2rem 0 .6rem">Each project owns its deployments and AI conversation. Connections, servers, connectors and repositories can be reused across projects. Pick the active project here or in the header.</p>
  <p class="pj-readonly" id="projectsReadOnly" role="status" hidden></p>
  <input id="projectsFilter" type="search" placeholder="Filter by name or description…" autocomplete="off" aria-label="Filter projects">
  <div id="projectsList" class="pj-list"></div>
</aside>

<dialog id="pjModal" aria-labelledby="pjModalTitle">
  <form id="pjForm" method="dialog" novalidate>
    <h3 id="pjModalTitle" style="margin:0 0 .6rem;font-size:1rem">New project</h3>
    <div class="tf-grid">
      <div class="tf-field tf-span"><label for="pjName">Name</label><input id="pjName" required maxlength="80" placeholder="Client site, Staging, Internal tools…" autocomplete="off"></div>
      <div class="tf-field tf-span"><label for="pjDesc">Description <span class="hint">(optional)</span></label><textarea id="pjDesc" rows="3" maxlength="500" placeholder="What belongs in this project"></textarea><p class="tf-help" id="pjDescCount">0/500</p></div>
      <div class="tf-field tf-span">
        <label id="pjColorLabel">Colour <span class="hint">(optional, shown next to the project name)</span></label>
        <div class="pj-color-row" role="radiogroup" aria-labelledby="pjColorLabel">
          <span class="proj-dot pj-preview" id="pjPreviewDot" aria-hidden="true"></span>
          <button type="button" role="radio" aria-checked="true" class="pj-color-none on" id="pjColorNone" title="No colour">None</button>
          <div class="pj-swatches" id="pjSwatches"></div>
          <label class="pj-color-custom" title="Custom colour"><span class="sr-only">Custom colour</span><input type="color" id="pjColorPick" value="#4f8ef7"></label>
          <input type="hidden" id="pjColor" value="">
        </div>
      </div>
    </div>
    <p class="tf-err" id="pjErr" hidden></p>
    <div class="modal-foot"><button type="button" id="btnPjCancel">Cancel</button><span class="spacer"></span><button type="submit" class="primary" id="btnPjSave">Create project</button></div>
  </form>
</dialog>
