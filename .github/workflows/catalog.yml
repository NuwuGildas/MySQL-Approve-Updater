# Rebuilding the marketplace catalog BY HAND.
#
# The catalog is normally published by the module workflow that cut the release
# (scripts/module-workflow.js → the `catalog` job), because a tag push only runs
# workflows present in the tagged commit and these tags point into a module
# branch — and because a release created with GITHUB_TOKEN raises no event that
# could start a workflow here.
#
# This exists for the times that is not enough: a release edited or deleted by
# hand, a catalog asset lost, or a signing key rotated. Both paths run the same
# scripts/publish-catalog.sh, so there is one implementation of the rule.
name: catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild and publish the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-catalog.sh
